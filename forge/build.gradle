plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
    alias libs.plugins.publishing
}


repositories {
    maven { url 'https://jitpack.io' }
    maven {
        url = "https://api.modrinth.com/maven"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "sizeshiftingpotions-common.mixins.json"
        mixinConfig "sizeshiftingpotions.mixins.json"
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge libs.forge
    modApi libs.pehkui.forge.get()
    modImplementation include(libs.midnightlib.forge.get())
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }
}

publishMods {
    displayName = "Size Shifting Potions v${project.version} Forge"
    file = remapJar.archiveFile
    changelog = file("$rootDir/CHANGELOG.md").text
    version = "v${project.version}-forge"
    type = STABLE
    modLoaders.addAll("forge")
    curseforge {
        projectId = "447440"
        minecraftVersions.add("1.20.1")
        accessToken = providers.gradleProperty("CF_API_KEY")
        embeds {
            slug = "midnightlib"
        }
        requires {
            slug = "pehkui"
        }
    }
    modrinth {
        projectId = "rfj2v0X6"
        minecraftVersions.add("1.20.1")
        accessToken = providers.gradleProperty("MODRINTH_TOKEN")
        embeds {
            slug = "midnightlib"
        }
        requires {
            slug = "pehkui"
        }
    }
    github {
        repository = "UltrusBot/SizeShiftingPotions"
        commitish = "1.20"
        accessToken = providers.gradleProperty("GH_TOKEN")
        tagName = "v$project.version"
    }

    dryRun = false
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    classifier "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    classifier null
    afterEvaluate {
        archiveClassifier = "forge"
    }
}

jar {
    classifier "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
